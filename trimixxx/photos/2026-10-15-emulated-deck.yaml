alt: "An emulated TriMixxx deck on a Mac. Above, its screen: Cadaverous by Venetian Snares at 174 BPM, with SYNC and MASTER lit. Below, the panel that stands in for the deck's controls: loop and hot cue buttons, the jog wheel, the browse encoder and the tempo fader, with PLAY/PAUSE lit green."
